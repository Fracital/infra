# Match abusive POSTs to /api/auth/register in OpenResty combined access logs.
# Extracts the Cloudflare connecting IP from the log line.
#
# Log format:
# '$http_cf_connecting_ip - $remote_user [$time_local] "$request" $status ...'

[Definition]
failregex = ^<HOST> - .* "POST /api/auth/register HTTP/[0-9.]+" (?:400|401|403|429)
ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=openresty.service + SYSLOG_IDENTIFIER=openresty

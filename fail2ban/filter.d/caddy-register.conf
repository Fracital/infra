# Match abusive POSTs to /api/auth/register in Caddy JSON journal lines.
# Captures Cloudflare's real client IP (CF-Connecting-Ip), NOT the CF edge.

[Definition]
failregex = ^.*"/api/auth/register".*"Cf-Connecting-Ip":\["<HOST>"\]
            ^.*"Cf-Connecting-Ip":\["<HOST>"\].*"/api/auth/register"
ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=caddy.service + SYSLOG_IDENTIFIER=caddy

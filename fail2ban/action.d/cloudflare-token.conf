# Ban/unban via Cloudflare Firewall Access Rules using an API Token (Bearer).
# Reads credentials from /etc/fail2ban/cloudflare.env (chmod 600):
#   CF_TOKEN=...
#   CF_ZONE=...   (optional; tries user rules first, then zone rules)

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /bin/bash -c 'set -euo pipefail; . /etc/fail2ban/cloudflare.env; ip="<ip>"; at="<addr_type>"; notes="fail2ban <name> $ip"; payload=$(printf "{\"mode\":\"block\",\"configuration\":{\"target\":\"%s\",\"value\":\"%s\"},\"notes\":\"%s\"}" "$at" "$ip" "$notes"); code=$(curl -sS -o /tmp/f2b-cf-ban.json -w "%%{http_code}" -X POST "https://api.cloudflare.com/client/v4/user/firewall/access_rules/rules" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$payload" || true); if [[ "$code" != 200 ]]; then if [[ -n "${CF_ZONE:-}" ]]; then curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/firewall/access_rules/rules" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$payload" >/tmp/f2b-cf-ban.json; else exit 1; fi; fi'
actionunban = /bin/bash -c 'set -euo pipefail; . /etc/fail2ban/cloudflare.env; ip="<ip>"; id=$(curl -sS -G "https://api.cloudflare.com/client/v4/user/firewall/access_rules/rules" -H "Authorization: Bearer $CF_TOKEN" --data-urlencode "configuration.value=$ip" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get(\"result\") or []; print(r[0][\"id\"] if r else \"\")"); if [[ -n "$id" ]]; then curl -sS -X DELETE "https://api.cloudflare.com/client/v4/user/firewall/access_rules/rules/$id" -H "Authorization: Bearer $CF_TOKEN" >/dev/null; elif [[ -n "${CF_ZONE:-}" ]]; then id=$(curl -sS -G "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/firewall/access_rules/rules" -H "Authorization: Bearer $CF_TOKEN" --data-urlencode "configuration.value=$ip" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get(\"result\") or []; print(r[0][\"id\"] if r else \"\")"); if [[ -n "$id" ]]; then curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/firewall/access_rules/rules/$id" -H "Authorization: Bearer $CF_TOKEN" >/dev/null; fi; fi'

[Init]
addr_type = ip

[Init?family=inet6]
addr_type = ip6
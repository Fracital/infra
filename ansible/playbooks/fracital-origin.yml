#   ansible-playbook playbooks/fracital-origin.yml --vault-password-file <file>
- name: Fracital origin
  hosts: fracital_origin
  gather_facts: false
  roles:
    - role: fracital_origin
      tags: [origin]
    # The unprivileged user Fracital's CI deploys as (README.md "Deploy user").
    - role: deploy_user
      tags: [deploy_user]

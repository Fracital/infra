---
# roles/edge_relay defaults. Most of this role's variables live in inventory/group_vars.

# OpenResty `worker_processes` (nginx.conf.j2). auto = one per CPU, right for a box whose cores
# are all OpenResty's. A box that shares its cores with holyWisp pins both (host_vars: the edge on
# divide gives OpenResty 3 of its CT's 6 cores, edge_wisp holywisp_workers the other 3).
edge_openresty_workers: auto

# The edge="..." field of every access-log line (nginx.conf.j2 log_format edge_combined). The
# inventory name by default; host_vars can name the box after its host instead (the edge on
# divide logs edge="divide").
edge_log_name: "{{ inventory_hostname }}"

# wisp.baby live usage stats (files/wispstats.lua; wispbaby/README.md "Live stats"): the
# per-box counters pushed to amph's Redis every 2 s, and /live, /live/history and /you on
# wisp.baby. Off by default; turning it on is the go-live step: set `wispstats_enabled: true` for
# [wisp_edge] (inventory/group_vars/wisp_edge.yml) once amph's collector runs. It only takes effect
# on [wisp_edge] hosts (the guard below), whatever the inventory says.
wispstats_enabled: false
# What the templates and tasks test: enabled, and a wisp box.
wispstats_on: "{{ (wispstats_enabled | bool) and ('wisp_edge' in group_names) }}"
# Salt of the client-address HMAC (distinct clients, "your usage"). It must be the same on every
# box, so that one client seen on two boxes counts once, and it must be secret, so a hash can't be
# tested against a guessed address. Derived from the shared auto-ssl Redis password, so it needs
# no vault entry of its own. Rotating that password re-keys the hashes, which only breaks the
# distinct-client count's continuity for the 30-day window.
wispstats_client_salt: "{{ ('wispbaby-clients:' ~ auto_ssl_redis_password) | hash('sha256') }}"
# DB-IP City Lite (CC BY 4.0; the page credits DB-IP), refreshed monthly by wispbaby-geoip.timer.
wispstats_mmdb: /var/lib/wispbaby/dbip-city-lite.mmdb
wispstats_mmdb_base_url: https://download.db-ip.com/free

# Traffic by domain (README "Live stats"): the organization each relay route counts its sessions
# under. The templates pass wispbaby (wisp.baby's own relay), abstract (abulxt byod), fracital
# (Fracital's names and holywisp.fracit.al) or holyunb (holyunb.locker's keyed path); a Fracital origin app (stomp) gets its own tag, picked by
# Host on the Fracital keyed path. Anything else is counted as "other".
wispstats_app_tags: "{{ fracital_origin_apps | default([]) | map(attribute='name') | map('lower') | map('regex_replace', '[^a-z0-9]', '') | list }}"
wispstats_tags: "{{ ['wispbaby', 'abstract', 'fracital'] + (['holyunb'] if holyunb_on | bool else []) + wispstats_app_tags }}"
wispstats_app_hosts: "{{ fracital_origin_apps | default([]) | subelements('hosts') }}"
wispstats_host_tags: "{{ dict(wispstats_app_hosts | map('last') | map('lower') | zip(wispstats_app_hosts | map('first') | map(attribute='name') | map('lower') | map('regex_replace', '[^a-z0-9]', ''))) }}"

# Link routing (files/link_routes.lua, README.md "Link routing"): the :443 default server looks
# each Host up in the edges' shared Redis (hash linkroute:v1, written by abulxt's Discord bot) and
# proxies it to the site staff registered it for: fracital, stomp, abstract (amph) or holy
# (holyunb). Off by default; on for the edge in inventory/group_vars/edge.yml. Off, every unknown
# Host goes to amph.
link_routes_enabled: false
link_routes_on: "{{ link_routes_enabled | bool }}"
# A Host with no entry (and a Host that is not a plain DNS name). holywisp: the placeholder page
# (files/placeholder.html), so a domain shows nothing until it is registered. It is never a value
# in Redis, only what a miss means here.
link_routes_default_site: holywisp
# Redis down, or the hash lost (no __ready field), and no stale copy cached: amph, as before link
# routing, so an outage never sends an abulxt domain elsewhere.
link_routes_unavailable_site: abstract
# Seconds. fresh: an answer is reused without Redis for this long (so a bot change reaches the edge
# within it). stale: the last good answer, kept for outages. retry: how long an outage answer is
# reused before Redis is asked again.
link_routes_fresh_ttl: 30
link_routes_stale_ttl: 86400
link_routes_retry_ttl: 5
# Connect, send and read timeout of the lookup. terp.db is a few ms away; amph (the rollback) is on
# the same bridge.
link_routes_redis_timeout_ms: 200
link_routes_dict_size: 4m
# The targets this box can serve: each needs the upstream its own routes file renders (Fracital's
# 30-fracital.conf, holyunb's 35-holyunb.conf) and, for stomp, a terp app of that name. A site
# that is off here is served by amph instead.
link_routes_fracital_on: "{{ (link_routes_on | bool) and (fracital_enabled | default(false) | bool) }}"
link_routes_stomp_on: "{{ (link_routes_fracital_on | bool) and ('stomp' in (fracital_origin_apps | default([]) | map(attribute='name') | list)) }}"
link_routes_holy_on: "{{ (link_routes_on | bool) and (holyunb_on | bool) }}"
# true: the long static name lists leave the edge config and those names go through the default
# server and the route table like any registered domain: fracital_hosts (with the private
# fracital_cloak_hosts, and every www.), fracital_extra_hosts (stomp.fracit.al) and holyunb_hosts
# lose their server_name entries and their local certificate approval (amph's /ask approves
# registered names). Import those names into linkroute:v1 first (README.md "Link routing",
# "Replacing the static lists"). holywisp.fracit.al and byod.fracit.al stay static, and so do
# wisp.baby, krunk.io, blockshooter, the mc names and the ACME forwards.
link_routes_replace_static: false
link_routes_replace_fracital: "{{ (link_routes_replace_static | bool) and (link_routes_fracital_on | bool) }}"
# fracital_extra_hosts go only when every one of them is a stomp name the table can route.
link_routes_replace_extra: "{{ (link_routes_replace_fracital | bool) and (link_routes_stomp_on | bool) and (fracital_extra_hosts | default([]) | difference(fracital_origin_apps | default([]) | selectattr('name', 'equalto', 'stomp') | map(attribute='hosts') | flatten) | length == 0) }}"
link_routes_replace_holy: "{{ (link_routes_replace_static | bool) and (link_routes_holy_on | bool) }}"
# What 30-fracital.conf's app servers answer by name and nginx.conf approves locally.
fracital_edge_server_names: >-
  {{ (([fracital_byod_fqdn] + ([] if link_routes_replace_extra | bool else fracital_extra_hosts | default([])))
      if link_routes_replace_fracital | bool else fracital_server_names) }}
# Fracital's content-hashed bundles (30-fracital.conf's cached /assets/ location, and link routing's
# @link_fracital_assets).
fracital_asset_regex: '^/assets/[A-Za-z0-9_-]{6,64}\.(?:js|mjs|css|wasm|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico)$'
# The :443 default server's client_max_body_size (abulxt). nginx's default is 1m, which rejected
# chat sends (/api/ai) with 413 before they reached the origin. Matches the origin's /api/ai and
# /v1 limit (abulxt deploy/openresty/snippets/routes-common.conf).
edge_client_max_body_size: 16m

# Per-worker connection cap and the file limit behind it (nginx.conf.j2). Every proxied request
# holds two connections (client and upstream), so 4096 ran out under the 2026-11-18 flood.
edge_worker_connections: 16384
edge_worker_rlimit_nofile: 65535

# L7 flood guard on the :443 default server (templates/flood-guard.conf.j2, byod-edge.conf.j2).
# Only the hosts listed here (and their www.) are guarded; every other name gets an empty key and
# is never limited or blocked. Added after the 2026-11-18 POST flood on abstracteducation.loan
# (about 13k req/s from about 650 school and ISP NAT addresses, mostly ChromeOS, never a Referer):
# - a POST with neither Referer nor Origin gets 403 (all of that flood, about 1% of real POSTs);
# - per client address, edge_flood_guard_rate (burst edge_flood_guard_burst) for every request
#   and edge_flood_guard_post_rate for POSTs. One address is often a whole school NAT, so these
#   stay generous; the flood sent 130 to 580 req/s per address.
# Blocked and rate-limited (429) requests are kept out of access.log (the flood wrote 3 MB/s).
edge_flood_guard_hosts:
  - abstracteducation.loan
edge_flood_guard_block_bare_post: true
edge_flood_guard_rate: 30r/s
edge_flood_guard_burst: 300
edge_flood_guard_post_rate: 5r/s
edge_flood_guard_post_burst: 50

# OpenResty's own logs (Debian's packages ship no logrotate for /usr/local/openresty): daily, or
# sooner once a log passes edge_log_maxsize at the next logrotate run.
edge_log_rotate_days: 7
edge_log_maxsize: 1G
# Each link routing target's limit in bytes (link_routes.lua checks Content-Length against it), and
# the largest, which location / needs so that nginx does not refuse a body before the lookup.
link_routes_body_limits:
  abstract: "{{ edge_client_max_body_size | upper | human_to_bytes }}"
  fracital: "{{ fracital_client_max_body_size | default(edge_client_max_body_size) | upper | human_to_bytes }}"
  stomp: "{{ fracital_client_max_body_size | default(edge_client_max_body_size) | upper | human_to_bytes }}"
  holy: "{{ holyunb_client_max_body_size | default(edge_client_max_body_size) | upper | human_to_bytes }}"
link_routes_body_max: "{{ link_routes_body_limits.values() | map('int') | max }}"
# The placeholder page (files/placeholder.html): holywisp.fracit.al's / and, with link routing, any
# name nobody registered.
edge_placeholder_dir: /var/www/edge-placeholder

# The buffer nginx relays an upgraded (WebSocket) connection through, one per direction, in the
# locations that proxy to holyWisp. Measured 2026-11-13 on wispdev, plain ws through nginx to
# holyWisp, one connection: default (4-8 KiB) 295-498 MiB/s at a full core, 64k 1,750-1,920,
# 128k 1,540-2,080, 256k 1,560-2,200; 8 connections x 4 streams 630-750 / 2,830 / 3,180 / 3,330.
# 128k is nearly all of it for 256 KiB of buffer per WebSocket.
edge_ws_proxy_buffer: 128k

# Holy Unblocker routes (templates/holyunb-routes.conf.j2, inventory/group_vars/all/holyunb.yml):
# enabled, and a wisp box. Every other edge gets no 35-holyunb.conf.
holyunb_on: "{{ (holyunb_enabled | default(false) | bool) and ('wisp_edge' in group_names) }}"

# blockshooter.io (templates/blockshooter-routes.conf.j2, inventory/group_vars/all/blockshooter.yml,
# blockshooter/README.md): enabled, and a wisp box. Every other edge gets no 36-blockshooter.conf.
blockshooter_on: "{{ (blockshooter_enabled | default(false) | bool) and ('wisp_edge' in group_names) }}"

# TCP 8080 by SNI (templates/nginx.conf.j2 stream block, mc-routes.conf.j2): off by default, when
# the http block's mcnode / catch-all servers own :8080 themselves. On (host_vars, the edge on
# divide): a stream server on :8080 reads the ClientHello's SNI without terminating TLS and sends
# edge_tcp8080_local_snis to the local TLS vhost on edge_tcp8080_local (which then listens there
# instead of :8080), every other SNI (and a ClientHello without one) to edge_tcp8080_default_upstream.
edge_tcp8080_split: false
edge_tcp8080_local: "127.0.0.1:8180"
edge_tcp8080_local_snis: [mcnode.abstracteducation.loan]
edge_tcp8080_default_upstream: ""

# Plain-HTTP ACME forwards (templates/acme-forwards.conf.j2, conf.d/<edge_acme_forwards_conf>):
# [{host, upstream, redirect?, comment?}]. Port 80 requests for Host <host> under
# /.well-known/acme-challenge/ are proxied to http://<upstream> (a box behind the same NAT that
# gets a certificate on the shared public address: blockshooter's IP cert, divide's own Proxmox
# cert); anything else on that Host is `return 301 <redirect>`, or 404 without one. Empty: the
# file is removed.
edge_acme_forwards: []
edge_acme_forwards_conf: 05-acme-forwards.conf

# krunk.io names kru serves with its own vhost and certificate (krunkio-routes.conf.j2): proxied
# with SNI = the name, no pinned cert, no token. Set in group_vars/edge.yml (dl.krunk.io).
krunkio_direct_hosts: []

# Name of a cloudflared tunnel running on the edge itself (installed by hand, not by this role), or
# empty. When set, realip also trusts CF-Connecting-IP from loopback, where cloudflared connects.
edge_local_cloudflared_tunnel: ""

---
# Fail before touching anything when the box or its host_vars are not what this role
# is written for. playbooks/pve.yml runs debian_release first, so a Debian 11/12 box
# arrives here on 13.
- name: Require Debian 13 (trixie)
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version | int == 13
    fail_msg: >-
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}: Proxmox VE 9
      installs on Debian 13 only (run debian_release first).
    quiet: true

- name: Require the host_vars (defaults/main.yml)
  ansible.builtin.assert:
    that:
      - pve_main_ip is defined and pve_main_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - pve_main_prefix is defined and (pve_main_prefix | int) >= 8 and (pve_main_prefix | int) <= 32
      - pve_gateway is defined and pve_gateway is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - pve_uplink_if is defined and pve_uplink_if | length > 0
      - pve_10g_ifs is defined and pve_10g_ifs is sequence and pve_10g_ifs is not string
      - pve_10g_ifs | length > 0
      - pve_uplink_if not in pve_10g_ifs
      - pve_bond_mode in ['active-backup', '802.3ad']
      - pve_ipv6 | length == 0 or '/' in pve_ipv6
      - pve_ipv6_gateway | length == 0 or pve_ipv6 | length > 0
      - (pve_net_rollback_seconds | int) >= 120
      - (pve_net_rescue_seconds | int) >= 180
    fail_msg: >-
      host_vars/{{ inventory_hostname }}.yml needs pve_main_ip, pve_main_prefix, pve_gateway,
      pve_uplink_if and pve_10g_ifs (the uplink not among them); pve_bond_mode is active-backup
      or 802.3ad; pve_ipv6 is address/prefix; rollback >= 120 s, rescue >= 180 s.
    quiet: true

---
# Proxmox (pve-cluster) needs the node name to resolve to the address the node is
# reached on, never to loopback: Debian's installer maps the hostname to 127.0.1.1.
- name: Set the hostname to {{ inventory_hostname }}
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Drop Debian's 127.0.1.1 hostname line
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    state: absent

- name: Map {{ pve_main_ip }} to {{ inventory_hostname }}.{{ pve_domain }}
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ pve_main_ip | regex_escape }}\s'
    line: "{{ pve_main_ip }} {{ inventory_hostname }}.{{ pve_domain }} {{ inventory_hostname }}"
    insertafter: '^127\.0\.0\.1'

# The wiki's own check: `hostname --ip-address` must give the main address.
- name: Resolve the node name
  ansible.builtin.command: hostname --ip-address
  register: pve_hostname_ip
  changed_when: false
  check_mode: false

- name: Require the node name to resolve to {{ pve_main_ip }} only
  ansible.builtin.assert:
    that:
      - pve_main_ip in pve_hostname_ip.stdout.split()
      - pve_hostname_ip.stdout.split() | select('match', '^127\.') | list | length == 0
    fail_msg: "{{ inventory_hostname }} resolves to '{{ pve_hostname_ip.stdout }}', want {{ pve_main_ip }}."
    quiet: true

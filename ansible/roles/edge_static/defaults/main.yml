---
# roles/edge_static: static sites served from the edge's own disk (docs/divide-host.md "Static sites on
# the edge"). The sites themselves are inventory (host_vars/edge.yml edge_static_sites); with
# none, the role removes its conf.d file and leaves the content alone.

# Where the content lives. On the edge this is CT 201's mount point mp0 (40 GB, divide-host.md
# "Static sites on the edge"), so the sites never fill the root filesystem. One directory per
# site, named after its host.
edge_static_root: /srv/static

# The user that delivers content (rsync over SSH, jumping through divide). Its keys are forced
# through rrsync, so a key can write under edge_static_root and nowhere else.
edge_static_user: static
# authorized_keys lines, each `restrict,command="/usr/bin/rrsync <edge_static_root>" ssh-ed25519 ...`.
edge_static_keys: []

# Each site:
#   host:        the server_name. Its certificate comes from auto-ssl like the byod names: the
#                name is a DNS-only A record for the edge, so abulxt-domains approves it.
#   listing:     a styled directory listing for directories without index.html (files/listing-*.lua).
#   maintenance: regex of the URIs that answer 503 while <root>/.maintenance/<host> exists.
#   cache_map:   [regex, Cache-Control] pairs for $es_<site>_cc, used by apps and unity_prefixes.
#   redirects:   exact locations that redirect: { at, code, to }.
#   proxies:     { at, pass, websocket, ... }: backends. Defaults match a small JSON API.
#                host: the Host header (default $host). headers: [{ name, value }] set on the
#                request (a secret value comes from a vaulted var). websocket: true (always
#                Upgrade), or auto (Upgrade only when asked, one path for HTTP and WebSocket, 1 d
#                timeouts). passthrough: true keeps the backend's Cache-Control and allows bodies
#                up to body_max (1m), for assets; hide_headers drops response headers there.
edge_static_sites: []

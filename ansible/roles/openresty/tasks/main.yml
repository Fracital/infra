---
# Install OpenResty + lua-resty-auto-ssl on an edge (Debian 11/12/13).
# Mirrors the proven manual setup on abulxt-ashburn:
#   - openresty from the official openresty.org apt repo
#   - lua-resty-auto-ssl + deps via luarocks (not packaged)
#   - fallback self-signed cert in /etc/resty-auto-ssl

- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - luarocks
      - openssl
      - rsync
    state: present
    update_cache: true

- name: Detect Debian codename
  ansible.builtin.command: lsb_release -cs
  register: debian_codename
  changed_when: false

- name: Resolve openresty apt suite (per-host override or OS codename)
  ansible.builtin.set_fact:
    openresty_apt_suite: "{{ openresty_apt_suite | default(debian_codename.stdout) }}"

- name: Download openresty ASCII GPG key
  ansible.builtin.get_url:
    url: https://openresty.org/package/pubkey.gpg
    dest: /tmp/openresty-pubkey.gpg
    mode: "0644"
  register: openresty_key

- name: The keyring and the downloaded key
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /tmp/openresty-pubkey.gpg
    - /usr/share/keyrings/openresty.gpg
  register: openresty_key_files

# A key swapped on openresty.org (or in transit) is not trusted for the packages.
- name: The downloaded key is OpenResty's ({{ openresty_signing_key_fpr }})
  ansible.builtin.shell: |
    set -euo pipefail
    gpg --batch --with-colons --show-keys /tmp/openresty-pubkey.gpg | awk -F: '$1 == "fpr" { print $10; exit }'
  args:
    executable: /bin/bash
  register: openresty_key_fpr
  changed_when: false
  failed_when: openresty_key_fpr.stdout != openresty_signing_key_fpr
  check_mode: false
  when: openresty_key_files.results[0].stat.exists

- name: Dearmor openresty GPG key into keyring
  ansible.builtin.command: gpg --batch --yes --dearmor -o /usr/share/keyrings/openresty.gpg /tmp/openresty-pubkey.gpg
  when: openresty_key.changed or not openresty_key_files.results[1].stat.exists
  changed_when: true

- name: Add openresty apt repository (deb822 format)
  ansible.builtin.deb822_repository:
    name: openresty
    types: deb
    uris: "https://openresty.org/package/debian"
    suites: "{{ openresty_apt_suite }}"
    components: openresty
    signed_by: /usr/share/keyrings/openresty.gpg
    state: present
  when: openresty_install_method | default('apt') == 'apt'

- name: Install openresty via apt
  ansible.builtin.apt:
    name: openresty
    state: present
    update_cache: true
  when: openresty_install_method | default('apt') == 'apt'

# Debian 13 (trixie) edges: apt's sqv verifier rejects OpenResty's SHA1-signed
# repo, so the role installs the bookworm .debs itself, checked the way apt would
# (tasks/debs.yml, files/openresty-debs), and keeps them at the repo's newest.
- name: OpenResty .debs (Debian 13 direct install)
  ansible.builtin.include_tasks: debs.yml
  when: openresty_install_method | default('apt') == 'debs'

- name: Workers' own user and the service sandbox
  ansible.builtin.include_tasks: isolation.yml

- name: Check if lua-resty-auto-ssl is installed
  ansible.builtin.stat:
    path: /usr/local/share/lua/5.1/resty/auto-ssl.lua
  register: auto_ssl_rock

- name: Install lua-resty-auto-ssl via luarocks
  ansible.builtin.command: luarocks install lua-resty-auto-ssl
  when: not auto_ssl_rock.stat.exists

- name: Create auto-ssl state directory
  ansible.builtin.file:
    path: "{{ openresty_auto_ssl_dir }}"
    state: directory
    owner: "{{ openresty_user }}"
    group: "{{ openresty_group }}"
    mode: "0750"

- name: Generate fallback self-signed certificate (if absent)
  ansible.builtin.command: >
    openssl req -new -newkey rsa:2048 -days 3650 -nodes -x509
    -subj /CN=fallback
    -keyout {{ openresty_auto_ssl_dir }}/fallback.key
    -out {{ openresty_auto_ssl_dir }}/fallback.crt
  args:
    creates: "{{ openresty_auto_ssl_dir }}/fallback.crt"

- name: Set fallback cert permissions
  ansible.builtin.file:
    path: "{{ openresty_auto_ssl_dir }}/{{ item.name }}"
    owner: "{{ openresty_user }}"
    group: "{{ openresty_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: fallback.key, mode: "0600" }
    - { name: fallback.crt, mode: "0640" }

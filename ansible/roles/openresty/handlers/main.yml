---
# A drop-in another role renders (edge_relay's 60-front-socket.conf): systemd reads it, nothing
# restarts. It applies at the next start.
- name: Reload openresty unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: reload openresty unit

# First, so a play that also reloads restarts before it (tasks/restart_isolated.yml).
- name: Restart openresty isolated
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/restart_isolated.yml"
  listen: restart openresty isolated

# A new nginx binary or library (tasks/debs.yml): swapped in on the fly (SIGUSR2, then SIGQUIT to
# the old master), so open connections finish on the old workers. Before the reload handlers, which
# then reach the new master. files/openresty-binary-upgrade aborts, leaving the old master serving,
# when the new one does not come up.
- name: Upgrade openresty binary
  ansible.builtin.command: /usr/local/sbin/openresty-binary-upgrade
  changed_when: true
  listen: upgrade openresty binary

- name: Test openresty configuration
  ansible.builtin.command: "{{ openresty_prefix }}/nginx/sbin/nginx -t"
  register: openresty_test
  changed_when: false
  listen: reload openresty

- name: Reload openresty
  ansible.builtin.systemd:
    name: openresty
    state: reloaded
    enabled: true
  listen: reload openresty
  when: openresty_test.rc == 0

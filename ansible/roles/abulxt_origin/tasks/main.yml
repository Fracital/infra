---
# Configure amph (origin dedi) to support the multi-edge fleet:
#   1. Only with abulxt_origin_redis_on (shared_redis_on_terp_db false, the rollback): Redis bound
#      to the public interface, password-protected, the shared lua-resty-auto-ssl store (certs +
#      ACME http-01 tokens) and wisp.baby's stats for all edges. Otherwise it is stopped: since
#      2026-11-17 that Redis is on terp.db (docs/terp-db.md).
#   2. Remove amph's retired in-guest firewall (abulxt-firewall.sh): divide's pve-firewall
#      (213.fw) decides who reaches 8822 (abulxt-domains), 9080 (origin-internal) and 1082.

# Read amph's own ed25519 pubkey so the edge play can revoke it on the edges
# (the removed byod watchdog's login, roles/edge_network).
- name: Read amph's SSH public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: amph_pubkey_b64
  failed_when: false

- name: Expose amph's SSH pubkey for other plays
  ansible.builtin.set_fact:
    amph_pubkey: "{{ amph_pubkey_b64.content | b64decode | trim }}"
  when: amph_pubkey_b64.content is defined

- name: Redis for the edges on amph (rollback only)
  when: abulxt_origin_redis_on | bool
  block:
    - name: Install redis-server
      ansible.builtin.apt:
        name: redis-server
        state: present
        update_cache: true

    - name: Render redis config for shared auto-ssl storage
      ansible.builtin.template:
        src: redis-autossl.conf.j2
        dest: /etc/redis/redis.conf
        owner: redis
        group: redis
        mode: "0640"
      notify: restart redis

    - name: Ensure redis is enabled and started
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: true

# Left running, a stale amph Redis keeps answering anything still pointed at it, so a missed client
# would read old certificates instead of failing loudly. /var/lib/redis/dump.rdb stays as the rollback.
- name: Stop amph's Redis while the edges use terp.db
  ansible.builtin.systemd:
    name: redis-server
    state: stopped
    enabled: false
  when: not (abulxt_origin_redis_on | bool)
  failed_when: false

# amph's in-guest firewall (abulxt-firewall.sh, iptables chain ABULXT_INPUT, v4 and v6) is
# retired since 2026-11-18: divide's pve-firewall filters amph's NIC (/etc/pve/firewall/213.fw:
# only the edge reaches 80, 443, 1082, 8822 and 9080; ssh only from divide and wg), and guest
# rules belong there, not inside the guest (docs/divide-host.md "Guest firewalls"). This removes
# the old one wherever it is still installed.
- name: Look for the retired abulxt-firewall.service
  ansible.builtin.stat:
    path: /etc/systemd/system/abulxt-firewall.service
  register: abulxt_firewall_unit

- name: Stop and disable the retired abulxt-firewall.service
  ansible.builtin.systemd_service:
    name: abulxt-firewall.service
    state: stopped
    enabled: false
  when: abulxt_firewall_unit.stat.exists

- name: Remove the ABULXT_INPUT chains (pve-firewall on divide filters amph)
  ansible.builtin.shell: |
    set -eu
    changed=0
    for t in iptables ip6tables; do
      if $t -n -L ABULXT_INPUT >/dev/null 2>&1; then
        while $t -C INPUT -j ABULXT_INPUT 2>/dev/null; do $t -D INPUT -j ABULXT_INPUT; done
        $t -F ABULXT_INPUT
        $t -X ABULXT_INPUT
        changed=1
      fi
    done
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: abulxt_firewall_chains
  changed_when: "'changed=1' in abulxt_firewall_chains.stdout"
  when: not ansible_check_mode

- name: Remove the retired firewall's script, unit and settings
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/abulxt-firewall.sh
    - /etc/systemd/system/abulxt-firewall.service
    - /etc/systemd/system/abulxt-firewall.service.d
    - /etc/abulxt/firewall.env
  register: abulxt_firewall_files

- name: Reload systemd after removing the firewall unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: abulxt_firewall_files is changed

# amph relays the mc subdomains to the Eaglercraft backend on its local subnet
# (the remote edges can't route to it). Edges forward here with the original
# Host header.
- name: Render Eaglercraft / MC panel relay on amph
  ansible.builtin.template:
    src: mc-relay.conf.j2
    dest: "{{ openresty_conf_dir }}/conf.d/25-mc-relay.conf"
    owner: root
    group: root
    mode: "0644"

# estro.help: edges relay it here like any byod name; amph forwards over the VLAN.
# `--tags estro` renders only this file (skips the firewall rebuild).
- name: Render estro.help relay on amph
  ansible.builtin.template:
    src: estro-relay.conf.j2
    dest: "{{ openresty_conf_dir }}/conf.d/57-estro.conf"
    owner: root
    group: root
    mode: "0644"
  tags: [estro]
  notify: reload openresty on amph

# Shady-traffic hop: edges' Wisp routers forward "shady" streams here over an
# authenticated SOCKS5 relay that chains into mullvad-pool (127.0.0.1:1080),
# so those streams exit via a Mullvad relay instead of the edge's own IP.
- name: Ensure /opt/abulxt and /etc/abulxt exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/opt/abulxt, /etc/abulxt]

- name: Install shady-relay.py
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../byod/shady-relay.py"
    dest: /opt/abulxt/shady-relay.py
    owner: root
    group: root
    mode: "0755"
  notify: restart shady relay

- name: Render shady-relay credential
  ansible.builtin.copy:
    dest: /etc/abulxt/shady-relay.json
    owner: root
    group: root
    mode: "0600"
    content: "{{ {'user': shady_relay_user, 'pass': shady_relay_password} | to_nice_json }}\n"
  notify: restart shady relay

- name: Install shady-relay systemd unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../byod/shady-relay.service"
    dest: /etc/systemd/system/shady-relay.service
    owner: root
    group: root
    mode: "0644"
  register: shady_relay_unit

- name: Reload systemd when the relay unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: shady_relay_unit.changed

- name: Enable and start shady-relay
  ansible.builtin.systemd:
    name: shady-relay.service
    enabled: true
    state: started
  notify: reload openresty on amph

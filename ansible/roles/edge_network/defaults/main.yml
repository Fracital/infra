---
# TCP for the client legs. A Wisp client carries every stream over one WebSocket, so one TCP
# connection to OpenResty carries a whole browser's traffic, over whatever path that client has.
# Debian's defaults (cubic, a 4 MiB send-buffer cap) hold such a connection to 4 MiB per round
# trip and halve it at every loss. Measured 2026-11-13 on wispdev, one download over an emulated
# path, the default against this table: 40 ms 89 vs 530 MiB/s; 100 ms with 0.1% loss 1-20 vs
# 148; 150 ms with 0.5% loss about 1 vs 68. The same collapse is why terp runs BBR
# (roles/fracital_origin). Only new connections pick the congestion control up. The 32 MiB caps
# are per socket and only reached where a path's bandwidth-delay product asks for them; all TCP
# memory together stays bounded by net.ipv4.tcp_mem (sized by the kernel from RAM: wisp-mnz's
# 16 GB included), which this leaves alone.
edge_tcp_sysctl:
  net.ipv4.tcp_congestion_control: bbr
  net.ipv4.tcp_slow_start_after_idle: 0
  net.core.rmem_max: 33554432
  net.core.wmem_max: 33554432
  net.ipv4.tcp_rmem: "4096 131072 33554432"
  net.ipv4.tcp_wmem: "4096 16384 33554432"
# Where those land. A host can replace edge_tcp_sysctl with fewer keys: in a container (the edge,
# CT 201 on divide) net.core.rmem_max / wmem_max are not namespaced and cannot be set, so
# host_vars/edge.yml sets only tcp_wmem, tcp_slow_start_after_idle and the congestion control, in
# 90-edge-tcp-speed.conf (what runs there), and divide sets the buffer caps and its own TCP
# (docs/divide-host.md).
edge_tcp_sysctl_file: /etc/sysctl.d/90-abulxt-edge-tcp.conf
# Write /etc/modules-load.d/tcp_bbr.conf. false in a container: the host must load tcp_bbr.
edge_network_load_bbr: true

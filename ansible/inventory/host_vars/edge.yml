---
# edge: wisp.baby's Manassas region (G-Core Ashburn/Manassas, VA) and the only abulxt edge.
# LXC CT 201 on divide (since 2026-11-16; before that wisp-mnz, VM 115 on meal). Debian 13.
# One private address, 172.16.5.10/24 on divide's vmbr1 (gateway 172.16.5.1, the
# inventory's ansible_host), and one public address that is not on the box: public_ip, divide's
# 91.199.82.174, which DNATs tcp 80/443/8080 and udp 443 here. No usable public IPv6.
# Every byod name and wisp.baby are Cloudflare A records (DNS only) to public_ip: the old split
# (byod.abstracteducation.loan .32 .35 .42, byod.fracit.al .48 .63, wisp.baby .228) collapsed
# into that one address.
edge_city: Manassas
edge_region: Virginia
edge_country: US
edge_geo: { lat: 38.7509, lon: -77.4753 }
# The address clients reach and the edge's egress (divide masquerades vmbr1): the templates
# that need a public address (wisp.baby's /where, edge_warp's outside checks) use it.
public_ip: "{{ divide_public_ip }}"
# What third parties see as the edge's source address (Cloudflare Gateway's DoH allowlist via
# roles/gateway_dns): divide's NAT.
edge_subnet: "{{ public_ip }}/32"
# What the private origins see: the edge reaches amph, kru, terp and holy straight over the
# 172.16.5.0/24 network (terp's ufw via fracital_edge_subnets; amph has no firewall of its
# own, divide's 213.fw admits the edge).
edge_origin_source: "172.16.5.10/32"
# public_ip is not configured on the box (divide DNATs it here): edge_warp keeps the box's own
# streams to it off WARP and edge_network keeps them on the box (edge-own-address.service; roles
# edge_warp and edge_network defaults). wisp.baby's speed test then arrives from 172.16.5.10.
edge_public_ip_on_box: false
edge_primary_if: eth0

# No firewall or fail2ban inside the CT (docs/divide-host.md "Guest firewalls"): divide's
# pve-firewall (/etc/pve/firewall/201.fw) filters it, and its sshd is reachable only from divide and
# the admin VPN. These override group_vars/edge.yml (the contract shared with KrunkNative, which
# skips its divide guests the same way: kn_host_firewall false). Neither runs here since 2026-11-17.
edge_firewall_manage: false
fail2ban_manage: false

# Sizing: the CT has 6 cores (threads 0-2 and 16-18 on divide, since 2026-11-18; it had 8).
# OpenResty and holyWisp get 3 worker threads each instead of one per CPU apiece (edge_relay
# edge_openresty_workers, edge_wisp holywisp_workers). Measured on 2026-11-18 over 19 hours,
# holyWisp averaged 0.014 cores (57,058 connections, 222 GB to clients) and the edge's busiest
# minute used 4.2 threads, almost all of it OpenResty's TLS for a polling endpoint.
edge_openresty_workers: 3
holywisp_workers: 3
holywisp_workers_note: "divide edge: 3 of the CT's 6 cores; OpenResty has the other 3"

# TCP for the client legs (roles/edge_network), as live in the CT. Only per-namespace keys can be
# set there: net.core.rmem_max / wmem_max (32 MiB) are divide's /etc/sysctl.d/90-divide-tcp.conf,
# and tcp_bbr must be loaded on divide (/etc/modules-load.d/bbr.conf; docs/divide-host.md): the CT
# cannot load modules.
edge_tcp_sysctl_file: /etc/sysctl.d/90-edge-tcp-speed.conf
edge_tcp_sysctl:
  net.ipv4.tcp_wmem: "4096 16384 33554432"
  net.ipv4.tcp_slow_start_after_idle: 0
  net.ipv4.tcp_congestion_control: bbr
  # At most 128 KiB not yet sent in a socket's queue (in flight is not limited). Unlimited, a
  # client's Wisp socket held 15 to 23 MB unsent during a download (2026-11-16), and a small
  # request on another stream of that connection waited 230 to 416 ms behind it, at 14 to 28 ms
  # ping. Paired with holywisp_ws_write_high_water below, or the queue only moves into holyWisp.
  net.ipv4.tcp_notsent_lowat: 131072
edge_network_load_bbr: false
# Bytes queued toward one client before holyWisp pauses that client's remotes: 2 MiB, not the
# 8 MiB default, so what tcp_notsent_lowat keeps out of the kernel does not queue here instead.
# It is also the refill CONTINUE budget (conn_window): 2 MiB in flight per connection is
# ~200 Mbit/s of upload at 80 ms, past what a client of this box sends.
holywisp_ws_write_high_water: 2097152

# Access-log edge="..." (edge_relay edge_log_name): named after the host.
edge_log_name: divide
openresty_apt_suite: bookworm
openresty_install_method: debs
# One address, set by Proxmox (pct net0): edge_network adds nothing.
edge_extra_interface_ips: []
edge_extra_interface_ips_v6: []

# The byod names get public_ip, which is not on the box, so nginx listens on the wildcard only.
# byod.fracit.al has no address of its own any more: Fracital's names still match by server_name,
# and an unknown Host on either byod name lands on the catch-all (00-edge-relay.conf), whose link
# routing (README.md "Link routing") sends it where it is registered, a placeholder page when not. Its
# Cloudflare A record (public_ip) is kept by hand; an address listed here would be bound by nginx
# (fracital-routes.conf.j2), which public_ip cannot be.
edge_advertise_ips:
  - "{{ public_ip }}"
edge_advertise_ips_v6: []
edge_advertise_ips_fracital: []
edge_advertise_ips_v6_fracital: []

wisp_site: mnz
wisp_ips:
  - "{{ public_ip }}"
wisp_ips_v6: []
wisp_apex_ips:
  - "{{ public_ip }}"
wisp_apex_ips_v6: []

# TCP 8080 (divide DNATs it here): an nginx stream block splits it by SNI (edge_relay
# nginx.conf.j2). mcnode.abstracteducation.loan goes to the local TLS vhost on
# edge_tcp8080_local (mc-routes.conf.j2, Wings via amph); every other SNI, and none, is
# passed through untouched to blockshooter's 8080.
edge_tcp8080_split: true
edge_tcp8080_local: "127.0.0.1:8180"
edge_tcp8080_local_snis:
  - mcnode.abstracteducation.loan
edge_tcp8080_default_upstream: "172.16.5.48:8080"

# Other boxes' HTTP-01 on public_ip :80 (edge_relay acme-forwards.conf.j2, conf.d/05-divide-acme.conf):
# divide's own Proxmox certificate (divide.eli.gift; the rest of that name on :80 goes to the web
# UI on :8006; divide admits vmbr1 tcp 80 for this) and blockshooter's Let's Encrypt IP
# certificate (Host public_ip, lego on blockshooter).
edge_acme_forwards_conf: 05-divide-acme.conf
edge_acme_forwards:
  - host: divide.eli.gift
    upstream: "172.16.5.1:80"
    redirect: "https://$host:8006$request_uri"
    comment: divide, the Proxmox host
  - host: "{{ public_ip }}"
    upstream: "172.16.5.48:80"
    comment: blockshooter's IP certificate

# Cloudflare WARP, kernel mode (README.md "Cloudflare WARP"): clean Wisp TCP streams leave
# through 4 WireGuard tunnels (four free identities, registered by the role). On since
# 2026-11-13 (the user approved the rollout). In the CT the wireguard module must be loaded
# on divide.
edge_warp_enabled: true
edge_warp_accept_tos: true

# UDP on WARP: holyWisp marks its UDP for the tunnel the router picks (README "Cloudflare WARP").
holywisp_udp_warp: true
# Per-client WARP exits: holyWisp proxy-client-key (README "Cloudflare WARP").
holywisp_proxy_client_key: true
# WebTransport (group_vars/edge.yml): divide DNATs public udp 443 to this address, keeping the
# client's source, so the listener binds it rather than every interface (holyWisp's `host` here
# is "", which would include the WARP tunnels). Replies leave from 91.199.82.174 while divide's
# conntrack entry lives (about 30 s, kept up by holyWisp's 20 s keepalive); docs/divide-host.md.
holywisp_webtransport_host: "{{ ansible_host }}"

# Static sites (roles/edge_static, docs/divide-host.md "Static sites on the edge"): content on CT
# 201's mount point /srv/static, delivered with rsync as `static` through divide. pages.eli.gift
# came from giftshop (VM 111) on 2026-11-17: the file listing, and the Flying Gorilla client under
# /fg/ with its API and socket on fg (CT 206, 172.16.5.206:8787). Its DNS is a DNS-only A record
# for divide_public_ip, so abulxt-domains approves its certificate (no edge_relay change).
edge_static_keys:
  - restrict,command="/usr/bin/rrsync /srv/static" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICxBdxGZVgEAvDKkb97l2s7U8BYZo7w2Z+EVlJK9vpXU user@unblocker
# Where /fg/api/ and /fg/socket go: fg-api on fg, without the /fg/api prefix. From 22:12 to
# 22:22 UTC on 2026-11-17, while the game's database moved to terp.db, both went back to giftshop's
# nginx ("http://172.16.5.78", full path).
pages_fg_api_pass: "http://172.16.5.206:8787/"
# systemya.fracit.al (2026-11-18): SystemYA, rebuilt under Fracital. The edge only carries its two
# integrations; the frontend is SystemYA's: its CI rsyncs it into /var/www/systemya as the edge
# user `systemya` (rrsync, that folder only), jumping through divide on a forwarding-only key line
# (docs/divide-host.md "CI keys on divide"). The key's private half is SystemYA's CI secret.
# /api/ is Fracital's API: SystemYA signs in with Fracital Accounts (BETTER_AUTH_TRUSTED_ORIGINS on
# terp lists https://systemya.fracit.al for the OAuth popups and the cross-site handoff).
# /room/ is its holt chat: relayed to holt on amph's origin-internal listener, as the byod hosts
# are (X-BYOD-Token), with SystemYA's license (systemya_secrets.yml); holt's platform is `systemya`.
# /cdn/ and /v1/games/ are Holy Unblocker's theatre CDN and catalog API on holy, so its SDK
# (/cdn/index.js) runs same-origin (website2 docs/sdk.md). DNS: a DNS-only A record for
# divide_public_ip, so abulxt-domains approves the certificate.
systemya_holt_pass: "http://{{ abulxt_origin_ip }}:{{ abulxt_origin_internal_port }}/systemya/"
systemya_holy_pass: "http://{{ holyunb_origin_ip }}:{{ holyunb_origin_port }}"
pages_fg_socket_pass: "http://172.16.5.206:8787/socket"
edge_static_sites:
  - host: pages.eli.gift
    listing: true
    # The game's publisher sets the flag while it swaps a build in.
    maintenance: "^/fg(?:/|$)"
    # Unity's build files are content-hashed: revalidate them; everything else of the game is
    # never cached, so a new build shows up on the next load.
    cache_map:
      - ["^/fg/Build/", "no-cache, must-revalidate"]
      - ["^/fg(?:/|$)", "no-store"]
    redirects:
      - { at: /fg, code: 301, to: "https://pages.eli.gift/fg/" }
      - { at: /fg/api, code: 308, to: /fg/api/ }
    proxies:
      - { at: "^~ /fg/api/", pass: "{{ pages_fg_api_pass }}" }
      - {
          at: "= /fg/socket",
          pass: "{{ pages_fg_socket_pass }}",
          websocket: true,
        }
    hidden:
      - '^/fg/(?:.*/)?\.'
    apps:
      - /fg/
    unity_prefixes:
      - /fg/
    unity_compressed: true
  - host: systemya.fracit.al
    root: /var/www/systemya
    fallback: /index.html
    deploy:
      user: systemya
      keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICY6Q87ApKXOGOqd/0Pnb1nCoJ5+FT9yl5Bbg2uksNJd systemya-ci@edge
    proxies:
      # Fracital Accounts: SystemYA has no backend, so Fracital answers /api/ for this host (sign-in,
      # /api/me, and /api/me/chat, holt's userState). Through edge_relay's terp snippet; an empty
      # X-FRX-App sends it to Fracital on terp's default server.
      - at: "^~ /api/"
        include: snippets/fracital-origin.conf
        headers:
          - { name: X-FRX-App, value: "" }
        timeout: 120s
        body_max: "{{ fracital_client_max_body_size }}"
      - at: "^~ /room/"
        pass: "{{ systemya_holt_pass }}"
        host: holt.abstracteducation.loan
        websocket: auto
        headers:
          - { name: X-BYOD-Token, value: "{{ byod_token }}" }
          - { name: X-Holt-License, value: "{{ systemya_holt_license }}" }
      - at: "^~ /v1/games/"
        pass: "{{ systemya_holy_pass }}"
        host: holyunb.locker
        timeout: 15s
        body_max: 16k
      - at: "^~ /cdn/"
        pass: "{{ systemya_holy_pass }}"
        host: holyunb.locker
        passthrough: true
        timeout: 3600s
        # holy's theatre file server (website2 runtime.js serveFile) only takes send's 200 and 206:
        # a revalidation that matches (send's 304) falls through to its HTML 404 page, so every
        # cached thumbnail broke on reload (2026-11-18). holy says max-age=0, so browsers revalidate
        # every load; holyunb.locker hides it behind Cloudflare's 4 h max-age. Without the
        # validators holy answers 200 with the file.
        headers:
          - { name: If-None-Match, value: "" }
          - { name: If-Modified-Since, value: "" }

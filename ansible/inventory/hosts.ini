# Abulxt edge infrastructure inventory.
#
# Hostnames are the SSH config aliases (see ~/.ssh/config, abulxt-* block),
# so Ansible reuses the same identity/keys you use interactively.
#
# All G-Core Labs, AS202422, Ashburn/Manassas. Since 2026-11-16 the abulxt hosts are guests
# of the Proxmox host divide (alias wisp.baby, divide_public_ip 91.199.82.174, its only
# public address; no public IPv6 for guests). Guests sit behind NAT on divide's vmbr1,
# 172.16.5.0/24 (gateway 172.16.5.1), so every ansible_host below is private and is reached
# through divide: [divide_guests] carries the ProxyJump (group_vars/divide_guests.yml).
# divide DNATs its public ports to them: tcp 80/443/8080 + udp 443 -> edge, udp 51820 -> wg,
# tcp+udp 21015-21017,21115 -> kn, udp 21100 -> kru, udp 4433/8443 and tcp 7778 (game-server
# allowlist) -> blockshooter, tcp 8443 -> terp 172.16.5.62 (dev.fracit.al). tcp 22 on
# 91.199.82.174 is divide's own SSH. divide's own firewall: docs/divide-host.md.
# meal (5.188.124.0/24) keeps only terp and holy.

[edge]

[origin]
# amph: the same VM, moved from meal to divide; private only now (its public .41/.55 are gone).
amph                ansible_host=172.16.5.3

# Fracital's origin (not an abulxt host: outside the abulxt group, no fail2ban base).
# terp stays on meal (managed on its public address, no jump). The edge reaches it on its
# private 172.16.5.62 instead (fracital_origin_ip), and divide DNATs tcp 8443 there (dev.fracit.al).
[fracital_origin]
terp                ansible_host=5.188.124.62

# The wisp edge. Since 2026-11-16 it is one box: edge, LXC CT 201 on divide (172.16.5.10,
# public address public_ip = 91.199.82.174 through divide's DNAT), which serves abulxt byod,
# Fracital (stomp, holywisp.fracit.al) and wisp.baby. It replaced wisp-mnz (VM 115 on meal);
# its host_vars are in git history. The overseas wisp cloud (hv-iev, hv-mia,
# hv-jnb, hv-ams and their wisp-, kn- and bs- VMs) and the dormant 1 Gb/s boxes (wisp-tlv-1g,
# wisp-ala-1g) were dismantled. playbooks/wisp.yml configures the edge roles.
#
# [wisp_pve], [kn_vm] and [bs_vm] are kept, empty, for a future region: a G-Core 10GbE dedi
# as Proxmox host hv-<site> (playbooks/pve.yml) running wisp-<site> (playbooks/pve-vm.yml)
# and, when listed, a fixed-size kn-<site> (VM 110) or bs-<site> (VM 120) next to it
# (README.md "The wisp cloud"). kn and bs VMs are never edges: no child of [edge],
# [wisp_edge] or [abulxt].
[wisp_pve]

[wisp_edge]
edge                ansible_host=172.16.5.10

[kn_vm]

[bs_vm]

# blockshooter: the Ashburn/Manassas blockshooter relay, LXC CT 202 on divide (172.16.5.48;
# replaced bs-mnz, VM 125 on meal). Its relay's public address is
# divide_public_ip (held on lo, udp 8443 DNATed to it locally); its Let's Encrypt IP
# certificate's HTTP-01 is forwarded by the edge (host_vars/edge.yml edge_acme_forwards).
# Listed so it can be reached by name; nothing in this repo configures it.
[bs_ct_divide]
blockshooter        ansible_host=172.16.5.48

# kn: the Ashburn/Manassas KrunkNative game servers, LXC CT 203 on divide (172.16.5.94;
# replaced kn-mnz, VM 123 on meal). listen_host 172.16.5.94, public_host
# ashburn-N.krunk.io (A records -> divide_public_ip). Listed so it can be reached by name;
# nothing in this repo configures it (KrunkNative's CI does).
[kn_ct_divide]
kn                  ansible_host=172.16.5.94

[edge:children]
wisp_edge

# Convenience groups
[edge_debian13:children]
wisp_edge

[abulxt:children]
edge
origin
wisp_pve

# Guests of divide behind its NAT: reached with ProxyJump root@divide_public_ip.
[divide_guests:children]
origin
wisp_edge
bs_ct_divide
kn_ct_divide

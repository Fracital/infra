---
# Copy to inventory/group_vars/all/systemya_secrets.yml (gitignored), fill in, then encrypt it:
#   ansible-vault encrypt inventory/group_vars/all/systemya_secrets.yml --vault-password-file ~/.abulxt-vault-pass
# Each variable's GitHub secret is in scripts/ci-secrets.json; ansible/README.md "Secrets" says what it is.

# SystemYA's holt license, minted on amph (cd /opt/holt && npm run license -- mint --platform
# systemya --days 365); its copy is /root/holt-licenses/systemya.license there.
systemya_holt_license: REPLACE_ME # SYSTEMYA_HOLT_LICENSE

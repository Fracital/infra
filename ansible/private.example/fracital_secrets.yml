---
# Copy to inventory/group_vars/all/fracital_secrets.yml (gitignored), fill in, then encrypt it:
#   ansible-vault encrypt inventory/group_vars/all/fracital_secrets.yml --vault-password-file ~/.abulxt-vault-pass
# Each variable's GitHub secret is in scripts/ci-secrets.json; ansible/README.md "Secrets" says what it is.

fracital_origin_token: REPLACE_ME # FRACITAL_ORIGIN_TOKEN
fracital_wisp_gate_key: REPLACE_ME # FRACITAL_WISP_GATE_KEY
fracital_origin_tls_key: |
  -----BEGIN PRIVATE KEY-----
  ...
  -----END PRIVATE KEY-----

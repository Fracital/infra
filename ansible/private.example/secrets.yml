---
# Copy to inventory/group_vars/all/secrets.yml (gitignored), fill in, then encrypt it:
#   ansible-vault encrypt inventory/group_vars/all/secrets.yml --vault-password-file ~/.abulxt-vault-pass
# Each variable's GitHub secret is in scripts/ci-secrets.json; ansible/README.md "Secrets" says what it is.

byod_token: REPLACE_ME # BYOD_TOKEN
auto_ssl_redis_password: REPLACE_ME # AUTO_SSL_REDIS_PASSWORD
shared_redis_password: REPLACE_ME # SHARED_REDIS_PASSWORD
gcore_api_token: REPLACE_ME # GCORE_API_TOKEN
cloudflare_zt_api_token: REPLACE_ME # CLOUDFLARE_ZT_API_TOKEN
shady_relay_password: REPLACE_ME # SHADY_RELAY_PASSWORD
wisp_gate_key: REPLACE_ME # WISP_GATE_KEY
vault_holywisp_client_key_master: REPLACE_ME # HOLYWISP_CLIENT_KEY_MASTER

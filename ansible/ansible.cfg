# Ansible configuration for abulxt edge infrastructure.
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
remote_user = root
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False
forks = 8
# Facts gathered per playbook run only (hosts are small, keep it simple).
gathering = smart
# Every host is Debian with /usr/bin/python3; skip the per-task discovery
# round-trip (it costs an extra SSH exec on every single task).
interpreter_python = /usr/bin/python3
# Only measure, never stall, when a task is slow.
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
# Keep the multiplexed socket alive for the whole run (a 60s persist expires
# between slow tasks and forces a fresh handshake). publickey only: the
# default auth order tries GSSAPI first and burns ~1s on every cold connect.
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=publickey -o GSSAPIAuthentication=no

[privilege_escalation]
become = False
